name: Sync DWM source files
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync source repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git clone "https://x-access-token:${GH_TOKEN}@github.com/ranjiths112007/Data-Warehouse-and-Mining.git" repo
          cd repo
          rm -rf .github
          rm -f *
          curl -L --fail -o 'CMD Screenshot.png' 'https://raw.githubusercontent.com/VIDHYASRI-ASML24011/DataWarehousing-and-Mining/main/CMD%20Screenshot.png'
          curl -L --fail -o 'DWM-TASK_2.png' 'https://raw.githubusercontent.com/VIDHYASRI-ASML24011/DataWarehousing-and-Mining/main/DWM-TASK_2.png'
          curl -L --fail -o 'VS Code Screenshot.png' 'https://raw.githubusercontent.com/VIDHYASRI-ASML24011/DataWarehousing-and-Mining/main/VS%20Code%20Screenshot.png'
          cat > README.md <<'MD'
# Data Warehousing & Mining

A practical collection of my **Data Warehousing and Data Mining (DWM)** coursework. This repository brings the practical outputs and supporting screenshots together in one place.

## 📚 What this covers

- **OLAP operations** — slice, dice, roll-up and drill-down
- **Data representation and analysis** with NumPy
- **Association rule mining** and FP-Growth
- **External sorting and data processing**
- Practical task outputs and execution evidence

## 📁 Files

| File | Purpose |
| --- | --- |
| `CMD Screenshot.png` | Command-line execution evidence |
| `DWM-TASK_2.png` | DWM practical task output |
| `VS Code Screenshot.png` | Development/implementation evidence |

## 🛠️ Tools

**Python · NumPy · Jupyter Notebook · Data Warehousing · Data Mining · PostgreSQL · VS Code**

## 🎯 Learning focus

The practical work is aimed at understanding how data is **organized, processed, transformed and mined for useful patterns**, connecting DWM concepts with hands-on implementation.

## 📝 Note

The screenshots are kept as practical/submission evidence from the coursework.

---

Built as part of my Data Warehousing & Mining coursework.
MD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync DWM coursework files'
          git push
